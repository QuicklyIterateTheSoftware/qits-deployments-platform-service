# How qits-platform-deployments deploys this repo. It reads this file from the git host at
# the built sha, so the answer travels with the commit.
#
# CARRYING THE FILE AT ALL is the other thing it says. The release flow reads it to decide whether
# this repository deploys — a library or an SPA carries none, and its `main` is finalized at the
# release itself rather than after a deployment — and where it does deploy, a Deployment Request
# carries the released VERSION. `deploy_branches` used to name a branch here, in
# thirteen copies of one platform-wide answer, and a release pushed onto every entry it named.
#
# This component is a PLATFORM service: one instance for the whole platform, deploying every
# environment. It has been both — platform first, then one deployer per tier — and this is the flip
# back. Two reasons, and neither is the deployer's own convenience:
#   * ENVIRONMENTS BECOME CROSS-ENVIRONMENT ENTITIES. A hierarchy like "dev gates prod" is a
#     relation between tiers, and a deployer that only ever sees its own tier cannot hold one.
#   * ONE TIER'S BUS CANNOT CARRY THAT EITHER. A per-tier deployer publishes DeploymentActive onto
#     its own tier's bus alone, so nothing outside that tier hears what it did.
#
# `deployment_target` IS spelled out, against the usual rule that a default should not be repeated:
# `environment` is the default, this file's answer has now changed twice, and a plane read off an
# omission is one edit away from being read wrong.

# THE NAME THIS DEPLOYS AS, spelled because the repository is renamed and the application is not.
# Every derivation the deployer makes hangs off this name — the wire alias peers dial, the container
# it manages, the extras family, the database — so letting it follow the repository would
# decommission the running service and start a stranger beside it.
#
# It is the SHORT name, and always has been: the repository was qits-platform-deployments while the
# catalog row, the wire alias and the qits_deployments database were qits-deployments.
application: qits-deployments

deployment_target: platform

# TWO DATABASES, and this is the component describing itself with its own mechanism. Each entry is
# a role and a database of its own on the platform environment's postgres — where a platform
# service's resources live — created before the successor container starts and injected as
# QITS_RESOURCE_<NAME>_URL / _USERNAME / _PASSWORD — the generic contract,
# which the jar that owns each store reads verbatim in its own shipped defaults. THE NAMES ARE NOT
# FREE: `db` is what the environments jar's datasource reads, `eventstream` is what the
# qits-eventstream jar's reads, and renaming either here silently stops matching.
#
# `db` takes the derived default database — `qits_` + the application name minus its `qits-` prefix,
# so qits_deployments — and says so by omitting the third segment. `eventstream` cannot: the default
# would be qits_deployments too, and one database cannot be two stores with two Flyway lineages, so
# it is named. The name carries this repository, because every consumer of that jar declares a
# resource called `eventstream` and they must not collide on one postgres.
#
# SELF-PROVISIONING WORKS HERE AND IS HOW THE SECOND ENTRY ARRIVES. This component is its own
# deployer, and the spec is read at the BUILT sha — so the running instance reads this file, creates
# both role/database pairs, and injects both triples into the successor it starts. Nothing special
# happens because the successor is itself.
#
# The flip re-keys both registry rows: a platform service's resources carry no environment name, so
# the rows move from ('qits-deployments', '<tier>') to the platform plane's null. The databases do
# not move — the platform plane provisions on the platform environment's postgres, which is the one
# they are already on. BootResourceRegistration writes the new key at every boot.
#
# ADOPTER #1, AND THE ONE THAT CANNOT PROVISION ITSELF FROM COLD. Only the very first container of a
# fresh platform has no deployer to do it: the bootstrap creates BOTH roles and databases over plain
# JDBC before this process exists and passes BOTH triples in deployment config, and
# BootResourceRegistration records what it was handed at every boot — so the first self-deploy after
# that finds a registry row per resource, takes the no-op arm, and injects the credentials the
# instance is already connected with. Without those rows it would rotate its own passwords out from
# under its own connection pools.
# The convention would derive the health path from the repository name, but the route path
# deliberately did not move with the rename — the service still serves /platform-deployments.
# Without this line the successor's probe curls /deployments/… into a 404 and every self-update
# rolls back as unhealthy. The old platform survived on an operator-corrected pd_service row;
# a row is not durable across a re-bootstrap — this line is.
health_path: /platform-deployments/q/health/ready

# The edge reads this declaration from DeploymentActive. `routes:` is the WIRE prefix — the API and
# the health endpoints — path-routed on every vhost. The client is not under it: it is served at the
# root of this service's own host, which the edge derives from the application name.
routes: /platform-deployments

# WHERE THE EDGE APPEARS THIS APPLICATION IN THE SIDEBAR. One entry per `<slot>.<Label>` pair — an
# application may hang several rows under one heading, and this one hangs a single row under
# `platform`, the project-scoped group, as its fourth entry. The label and the position are the whole
# statement — the host is derived from the application name (`qits-platform-deployments` minus its
# `qits-platform-` prefix is `deployments`), so there is no `host:` line to keep in step.
#
# This replaces `navigation: Deployments:2`, the flat list every application shared. The old key
# still parses — a spec is read at the built sha, so it can never become unknown — and maps to
# `system.Deployments`, which is the wrong group for a page a project scopes.
#
# THE PARSER SHIPPED FIRST. A spec is fetched at the BUILT sha and an unknown key fails a
# deployment, so this key could only land after the deployer that reads it was released.
navigation-entries: platform.Deployments:4

resources: postgresql:db, postgresql:eventstream:qits_deployments_eventstream

# STOP-FIRST, AND THIS COMPONENT IS THE REASON THE KEY EXISTS. The default is `start-first`: the
# successor starts beside the predecessor, which is what makes an orchestrator's rollback lossless.
# This deployer cannot be two processes at once — it holds the deployments config volume, it binds
# the surface an operator is watching, and its own succession is arbitrated by the swarm manager
# rather than by either instance. So it takes the gap in service it has today and says so, rather
# than being the one application an overlap surprises.
#
# It is read by the SWARM path (--update-order), which is the only path that deploys this component
# at all: the docker one has no arbiter for a self-update and refuses it.
#
# THE KEY MUST SHIP BEFORE THIS LINE DOES. A spec is fetched at the BUILT sha and an unknown key
# fails a deployment, so a deployer that predates the parser reads this file and refuses the build
# that would have taught it the word. Release the parser first, then this line.
update_order: stop-first

# Where the browsable API document lives: swagger-ui under this service's non-application
# root, which sits under the primary route above. The shell's Api Docs viewer reads it off
# /main-navigation and frames it for this repository.
api-docs: /platform-deployments/q/swagger-ui

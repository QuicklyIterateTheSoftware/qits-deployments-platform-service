# The per-commit userflow run: `mvn verify` at the pushed commit — which regenerates
# service/target/userstories/ through the five story classes named below — and the reports published
# as one docs bundle, site @userflows/qits-deployments-platform-service, version = the bare commit sha, branch riding
# as artifacts metadata for discovery.
#
# NON-GATING BY DESIGN, which is why it is a separate file from ci-post-receive.yml: this run going
# red must not cost the branch its image while "quality gate before merging" is still a decision to
# be taken — when it is, these per-commit runs are what the gate reads. One run per push per
# branch, collapsed to the newest tip under burst.
#
# THIS REPOSITORY IS THE DEPLOYER, and this file changes nothing about that. A userflow run pushes
# no commit and builds no image; it neither announces a build nor reaches the intake, so the
# self-deployment handoff ci-post-receive.yml documents is not in play here. `deployment_target:
# platform` in deployments.yml is likewise none of this file's business — the plane a service
# deploys ON has no bearing on how its commits are proved.
#
# `user: build`, and NOT a switch inside the script: the suite starts zonky's embedded postgres,
# initdb refuses to run as root and calls getpwuid, so the step needs a passwd-backed non-root
# user — maven-base carries one (uid 1001). The step containers are Alpine, which is why BOTH poms
# that name zonky architectures (deployments, service) carry the -alpine binaries as a fourth arch:
# `verify` here is the whole reactor, so PdSchemaTest's postgres has to start there too.
# qits-eventstream's pipeline is the measured precedent for all of it.
#
# Quinoa is off (`-Dquarkus.quinoa=false` — the extension's root toggle; `.enabled` is silently
# ignored and npm still runs): the client is ci-post-receive.yml's business, where the
# qits-deployments-platform-frontend submodule is initialised and its lockfile origins are swapped against the
# platform's npm registry, and none of that ritual belongs here — the stories assert nothing about
# the SPA. It is also what keeps this step from needing the submodule at all: the daemon's clone
# does not recurse, so service/src/main/webui arrives EMPTY, and an empty directory is the one case
# Quinoa treats as a misconfiguration rather than as "no client" (application.properties and
# docker/Dockerfile both say the same thing from their own side). The packaged fast-jar failsafe
# boots is otherwise exactly what ships.
#
# THE TWO IT FLAGS ARE THE OTHER HALF, and they are why this repository does NOT opt its service
# module back into ITs the way qits-githost does. `skipITs` is true in the root pom and stays true;
# this module has six integration tests and five of them belong to this run:
#
#   TokenValidationBootstrapIT      the gate-on boot, and the story that OWNS the startup traffic
#   DeploymentConfigurationIT       where a container's configuration comes from, and the refusal
#   BuildDeploymentIT               a green build end to end: create, replace, and no image at all
#   PlatformOverviewIT              what an operator reads, and what the image collector reads
#   AccessRefusalIT                 the two role sets, and the fact that they do not overlap
#
#   PdPackagedSurfaceIT             NOT in the list: half about the CLIENT (the base href at the
#                               root, the deep links, the fallback that must not swallow a machine
#                               path), which the quinoa line above deliberately does not build. A
#                               blanket `-DskipITs=false` would make this run red on a test that is
#                               right.
#
# THE ORDER IS LOAD-BEARING and it is the CLASS ORDERER's, not this list's. A cumulative recording is
# attributed by a cursor, so traffic from before the first story — the startup JWKS fetch — lands in
# whichever story drains first, and PlatformOverviewIT reads rows BuildDeploymentIT deployed. The
# framework's UserflowClassOrderer (registered as junit.quarkus.orderer.secondary-orderer in
# service/src/test/resources/application.properties) sorts on @UserflowRunsAfter and breaks ties by
# FQCN, which is why the story packages are named so that alphabetical is the intended order:
# ...deployments.api before ...deployments.stories.{configuration,deployment,operations,refusals}.
# Reordering the comma list below changes nothing; renaming a package could change everything.
#
# ALL FIVE SHARE ONE @TestProfile (stories.support.StoryProfile) and therefore ONE launched process,
# one embedded-postgres pair and one recording of each stand-in. That is the reason they can be one
# catalogue at all, and it is why a story class run ALONE may fail its own edge counts — it would
# inherit traffic an earlier class normally owns. Run the whole list.
#
# Naming the classes keeps the opt-in to this pipeline and to these stories, and keeps the property's
# own meaning ("run everything") intact for the `native` profile in service/pom.xml that sets it.
#
# NO REPAIR WAS NEEDED to make the two new test-scope jars resolve. This repository already carries
# `.qits-maven-settings.xml` and a `qits-maven` <repositories> entry — qits-auth-core,
# qits-eventstream, qits-arch-rules and qits-db-core have always come from the platform registry —
# and docker/Dockerfile already builds with `--network host` and `-s .qits-maven-settings.xml`, so
# the image builds resolve the test classpath there the same way they already resolved those four.
# (`-DskipTests` skips test EXECUTION, not test COMPILATION, so the jars are fetched during an image
# build too; they are small, and qits-userflows' transitive Playwright is a jar, not a browser —
# nothing downloads Chromium unless a story asks for a Flow, and neither of these does.)
#
# Loop review: this pipeline PUTs a docs bundle and pushes no commit — no cycle. The bundle is
# published to qits-artifacts and read back by qits-docs, neither of which is this service, and the
# one thing that could close a loop here — this component's own event bus and its own telemetry —
# is dark in the launched process by the two overrides the story profile sets. The three peers a
# deployment reads — the git host, qits-configuration and the idp's token endpoint — are
# stories/support/StoryPeers, an in-JVM stub, and the orchestrator is stories/support/StorySwarm, a
# recording POSIX-sh executable the profile points the container-runtime key at: no step container
# needs a docker socket, and nothing here can reach a real platform. Publish-if-absent:
# events redeliver and docs versions are immutable, so 409 is success (the qits-spa-ui-components
# release file's discipline).
event: SCMPublishCommit
when:
  # repoName, not repoId: since the identity cutover the git host's own coordinate is an opaque
  # UUID, so a name match belongs on the name. The event echoes the public name the push was
  # addressed with; a rename updates this line in the same campaign.
  - repoName: { exact: qits-deployments-platform-service }
    suppressCi: { exact: "false" }
checkout:
  branch: branch
  sha: sha
steps:
  - image: qits/build-images/maven-base:latest
    user: build
    timeout-seconds: 2400
    script: |
      set -eu
      # The platform registry, exactly as qits-eventstream's step derives it: the pom's default
      # names a host-published address unreachable from a step container, and the exact-id mirror
      # in .qits-maven-settings.xml is what passes Maven's HTTP blocker.
      export QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL"
      ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL" \
        -Dquarkus.quinoa=false \
        -DskipITs=false \
        "-Dit.test=TokenValidationBootstrapIT,DeploymentConfigurationIT,BuildDeploymentIT,PlatformOverviewIT,AccessRefusalIT"

      # `-C … .` so the story directories are the bundle's roots — nesting one directory deep would
      # put it in every served URL. The path is service/target/userstories because the stories live
      # in the one module that packages an artifact to boot.
      tar -czf userstories.tgz -C service/target/userstories .

      # Branch and commit ride as metadata (the docs store's exact-match discovery keys); the
      # version is the sha itself, so a bundle URL never changes meaning.
      status=$(curl -sS -o /tmp/docs-publish.out -w '%{http_code}' \
        -X PUT --data-binary @userstories.tgz \
        -H "X-Artifacts-Meta-git.branch.name: $QITS_CI_BRANCH" \
        -H "X-Artifacts-Meta-git.commit.hash: $QITS_CI_SHA" \
        -H "X-Artifacts-Meta-git.repository.name: qits-deployments-platform-service" \
        "$QITS_DOCS_URL/@userflows/qits-deployments-platform-service/-/$QITS_CI_SHA")
      case "$status" in
        201) echo "published userflows for qits-deployments-platform-service@$QITS_CI_SHA ($QITS_CI_BRANCH)" ;;
        409) echo "userflows for qits-deployments-platform-service@$QITS_CI_SHA already published — skipping" ;;
        *)   echo "docs publish failed: HTTP $status"; cat /tmp/docs-publish.out; exit 1 ;;
      esac

# THIS SERVICE FOLLOWS ITS FRONTEND. The client is a repository of its own, released on its own
# train, and embedded here as a submodule at service/src/main/webui — so a frontend release changes
# nothing until the gitlink in this repository moves. That is what this pipeline does: it fetches
# the released tag, rewrites the gitlink, and pushes the result to `maintenance/frontend`, where
# ci-event-maintenance-release.yml releases it like any other maintenance bump.
#
# ONE BRANCH, REUSED, force-pushed. Two frontend releases in a row must not leave two branches
# behind; the second replaces the first, and whatever the first did not release is superseded.
#
# The gitlink comparison makes this idempotent: a redelivered event whose tag is already recorded
# exits green without a push.
event: SCMRelease
when:
  - repository: { exact: qits-deployments-platform-frontend }
steps:
  - image: qits/build-images/node-base:latest
    timeout-seconds: 600
    script: |
      set -eu
      version=$(node -p 'JSON.parse(process.env.QITS_EVENT_PAYLOAD).version')
      frontend_url="${QITS_CI_REPOSITORY_URL%/*}/qits-deployments-platform-frontend"
      git -c submodule.qits-deployments-platform-frontend.url="$frontend_url" submodule update --init service/src/main/webui
      git -C service/src/main/webui fetch "$frontend_url" "refs/tags/$version:refs/tags/$version"
      git -C service/src/main/webui checkout --detach "$version"
      target=$(git -C service/src/main/webui rev-parse HEAD)
      current=$(git ls-tree HEAD service/src/main/webui | awk '{print $3}')
      if [ "$current" = "$target" ]; then exit 0; fi
      git update-index --add --cacheinfo 160000,$target,service/src/main/webui
      git -c user.name="qits release train" -c user.email="release-train@qits.local" commit -q -m "bump(qits-deployments-platform-frontend@$version): follow qits-deployments-platform-frontend"
      git push --force "$QITS_CI_REPOSITORY_URL" HEAD:refs/heads/maintenance/frontend
